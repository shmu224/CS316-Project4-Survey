<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Log In | Campus Study Habits Survey</title>
   <link rel="stylesheet" href="/style.css">
   <script src="/app.js" defer></script>
</head>
<body>
   <main>
      <h1>Campus Study Habits Survey</h1>
      <p>Log in to fill out or update your survey.</p>

      <form id="login-form" method="post">
         <label for="username">Username</label>
         <input id="username" name="username" type="text"
                autocomplete="username" maxlength="60" required>

         <label for="password">Password</label>
         <input id="password" name="password" type="password"
                autocomplete="current-password" maxlength="200" required>

         <label for="remember-username">
            <input id="remember-username" type="checkbox">
            Remember username
         </label>

         <button type="submit">Log in</button>
      </form>

      <form action="/create" method="get">
         <button type="submit">Create account</button>
      </form>
   </main>
</body>
</html>
